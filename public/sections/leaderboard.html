<!-- RIGHT: LEADERBOARD -->
<aside class="leaderboard-section">

    <div class="section-heading">
        <div>
            <h2>🏆 Leaderboard</h2>
            <p>See how your class is doing.</p>
        </div>
    </div>

    <div class="leaderboard-tabs">
        <button class="leaderboard-tab active"
                data-ranking="weekly">
            This week
        </button>

        <button class="leaderboard-tab"
                data-ranking="alltime">
            All time
        </button>
    </div>

    <div class="leaderboard" id="leaderboard">

        <!-- PODIUM -->
        <div class="podium">

            <div class="podium-user second">
                <div class="podium-avatar">M</div>
                <strong>Mike</strong>
                <small>1,850 XP</small>
                <div class="podium-block">2</div>
            </div>

            <div class="podium-user first">
                <div class="crown">👑</div>
                <div class="podium-avatar">S</div>
                <strong>Sarah</strong>
                <small>2,420 XP</small>
                <div class="podium-block">1</div>
            </div>

            <div class="podium-user third">
                <div class="podium-avatar">J</div>
                <strong>Jamie</strong>
                <small>1,620 XP</small>
                <div class="podium-block">3</div>
            </div>

        </div>

        <!-- RANKING ROWS -->
        <div class="ranking-row">
            <span class="ranking-number">4</span>
            <div class="ranking-avatar">L</div>
            <div class="ranking-name">
                <strong>Lucas</strong>
                <small>18 solved</small>
            </div>
            <strong class="ranking-xp">1,500 XP</strong>
        </div>

        <div class="ranking-row">
            <span class="ranking-number">5</span>
            <div class="ranking-avatar">E</div>
            <div class="ranking-name">
                <strong>Emma</strong>
                <small>16 solved</small>
            </div>
            <strong class="ranking-xp">1,420 XP</strong>
        </div>

        <!-- CURRENT USER -->
        <div class="ranking-row current-user">
            <span class="ranking-number">12</span>
            <div class="ranking-avatar">A</div>
            <div class="ranking-name">
                <strong>You · Alex</strong>
                <small>12 solved</small>
            </div>
            <strong class="ranking-xp">1,240 XP</strong>
        </div>

    </div>

    <button class="see-all-rankings" id="seeAllRankings">
        View full leaderboard →
    </button>

</aside>
