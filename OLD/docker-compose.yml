services:
  # Main application server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codefolio-app
    ports:
      - "3000:80"
    volumes:
      - ./DB:/var/www/db
      - ./cgi-bin:/var/www/cgi-bin
      - app_data:/var/www/data
    environment:
      - CLIENT_ID=${CLIENT_ID:-Ov23lipfbFJQzLspBO3t}
      - CLIENT_SECRET=${CLIENT_SECRET:-49ea74cc540528a1528f476a798a1403bdba861e}
      - CLIENT_REDIRECT_URL=${CLIENT_REDIRECT_URL:-http://localhost:3000/auth/github/callback}
      - DB_PATH=${DB_PATH:-/var/www/db/rayit.db}
      - RUN_MIGRATIONS=true
    depends_on:
      - cpp-sandbox
      - node-sandbox
    networks:
      - codefolio-network

  # C++ sandbox for code execution
  cpp-sandbox:
    build:
      context: .
      dockerfile: Dockerfile_cpp_sandbox
    container_name: codefolio-cpp-sandbox
    volumes:
      - sandbox_cpp:/app
    networks:
      - codefolio-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Node.js sandbox for code execution
  node-sandbox:
    build:
      context: .
      dockerfile: Dockerfile_node_sandbox
    container_name: codefolio-node-sandbox
    volumes:
      - sandbox_node:/app
    networks:
      - codefolio-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Grader daemon
  grader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codefolio-grader
    command: ["./graderd"]
    environment:
      - DB_PATH=${DB_PATH:-/var/www/db/rayit.db}
      - RUN_MIGRATIONS=false
    volumes:
      - ./DB:/var/www/db
      - grader_data:/var/www/grader
    depends_on:
      - cpp-sandbox
      - node-sandbox
    networks:
      - codefolio-network

volumes:
  app_data:
  sandbox_cpp:
  sandbox_node:
  grader_data:

networks:
  codefolio-network:
    driver: bridge